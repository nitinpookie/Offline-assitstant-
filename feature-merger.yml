name: Build Feature Merger APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: feature-merger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only zips named APK-Feature-Merger*.zip in the repo root are used (the newest one). Other apps' zips are ignored.
      - name: Prepare Feature Merger project
        shell: bash
        run: |
          set -e
          newest=""; best=-1
          for f in APK-Feature-Merger*.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ "$t" -ge "$best" ]; then newest="$f"; best="$t"; fi
          done
          if [ -z "$newest" ]; then
            echo "::error::No APK-Feature-Merger*.zip in the repo root. Upload APK-Feature-Merger-v15-CHAT.zip there."
            ls -la
            exit 1
          fi
          echo "Using zip: $newest"
          rm -rf /tmp/proj && mkdir -p /tmp/proj
          unzip -o -q "$newest" -d /tmp/proj
          sg=$(find /tmp/proj -name settings.gradle -not -path '*/__MACOSX/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$sg" ]; then
            echo "::error::settings.gradle not found inside $newest"
            exit 1
          fi
          src=$(dirname "$sg")
          # build in a clean folder so files of other apps in the repo can never get mixed in
          rm -rf /tmp/fm && mkdir -p /tmp/fm
          cp -a "$src"/. /tmp/fm/
          grep -n "versionName\|versionCode" /tmp/fm/app/build.gradle
          grep -n 'android:label' /tmp/fm/app/src/main/AndroidManifest.xml | head -1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34
        continue-on-error: true
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.4
        run: |
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: /tmp/fm
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (smaller and faster)
        working-directory: /tmp/fm
        continue-on-error: true
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp /tmp/fm/app/build/outputs/apk/debug/*.apk dist/FeatureMerger-debug.apk 2>/dev/null || true
          cp /tmp/fm/app/build/outputs/apk/release/*.apk dist/FeatureMerger-release.apk 2>/dev/null || true
          ls -la dist

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FeatureMerger-APK-run${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: warn
